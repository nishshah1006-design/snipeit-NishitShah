name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Install Playwright browsers
        run: pwsh src/SnipeIt.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
            **/playwright-traces/**
